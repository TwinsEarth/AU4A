name: CI

# 真实 CI：把项目「声称的事实」交给机器在每次 push 时复验，而不是写在文档里。
#
#   fmt      —— 格式门禁（只检查，不自动改写）
#   test     —— cargo test --workspace，ubuntu / windows / macos 三平台矩阵
#   clippy   —— cargo clippy --all-targets -- -D warnings（lint 门禁，warning 即失败）
#   msrv     —— 用 Cargo.toml 里声明的 rust-version = 1.88.0 真实构建（验证 MSRV 承诺）
#   verify   —— 10 条轨道自检 + 端到端 8 Agent + 只读观察面探针（GET 全 200、写方法全 405）
#   deploy   —— Windows 上真实部署脚本 deploy/verify.ps1
#   versions —— 逐个 checkout 10 个中版本收尾 tag（v1.0.10 … v1.9.9）并重跑 workspace 测试，
#               证明这条 99 小版本的版本线不是「只有 tag」，而是每个版本当时就真的能测过。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: msrv (rust 1.88.0 as declared)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check with the declared minimum toolchain
        run: cargo check --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  versions:
    name: version line (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tag:
          - v1.0.10
          - v1.1.10
          - v1.2.10
          - v1.3.10
          - v1.4.10
          - v1.5.10
          - v1.6.10
          - v1.7.10
          - v1.8.10
          - v1.9.9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tag }}
      - name: tag identity
        run: |
          echo "checking out ${{ matrix.tag }}"
          cat VERSION
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  verify:
    name: verify (10 tracks + e2e + read-only observer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build node (release)
        run: cargo build --release --locked -p au4a-node
      - name: track self-checks (must exit 0)
        run: ./target/release/au4a-node verify --json | tee verify.json
      - name: end-to-end run (8 agents, deterministic)
        run: ./target/release/au4a-node run --agents 8 --json | tee run.json
      - name: read-only observer probe (GET 200, write methods 405)
        run: |
          set -euo pipefail
          ./target/release/au4a-node run --agents 8 --observe 127.0.0.1:8787 > observer.log 2>&1 &
          OBS_PID=$!
          trap 'kill $OBS_PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            sleep 0.5
            if curl -fsS -o /dev/null http://127.0.0.1:8787/api/progress; then ready=1; break; fi
          done
          if [ "$ready" != "1" ]; then echo "::error::observer did not become ready"; cat observer.log; exit 1; fi
          for route in / /api/progress /api/results /api/revenue /api/selfcheck /api/tracks; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787${route}")
            echo "GET ${route} -> ${code}"
            test "$code" = "200" || { echo "::error::expected 200 for ${route}, got ${code}"; exit 1; }
          done
          for method in POST PUT PATCH DELETE; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" http://127.0.0.1:8787/api/revenue)
            echo "${method} /api/revenue -> ${code}"
            test "$code" = "405" || { echo "::error::observer accepted a write: ${method} -> ${code}"; exit 1; }
          done
          echo "只读观察面：6 条 GET 全部 200，4 种写方法全部 405。"
      - name: job summary
        if: always()
        run: |
          {
            echo "## AU4A verify"
            echo ''
            echo '```json'
            head -c 2000 verify.json 2>/dev/null || echo '(verify.json missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: au4a-verify-evidence
          path: |
            verify.json
            run.json
            observer.log
          if-no-files-found: warn

  deploy:
    name: deploy verify (Windows, deploy/verify.ps1)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: pwsh -File deploy/verify.ps1
        shell: pwsh
        run: ./deploy/verify.ps1 -Agents 8 -Port 8787
